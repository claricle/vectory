<svg xmlns="http://www.w3.org/2000/svg" id="Layer_1" class="st0 root">
  <style type="text/css"><![CDATA[
    /* .st0 stays in this comment */
    #Layer_1, rect, [class="st0"], [data-kind=.st0] { fill: url(#grad1); content: ".st0"; opacity: .5; }
    .st0.root:hover, .unused::before { stroke: red; }
    @media screen {
      .st0:is(.root, :not(.unused), [data-label=".st0"]) { fill: url("#grad1"); }
      @supports (display: grid) {
        @layer drawing { .root:has(> .st0):nth-child(2n of .unused) { --value: .st0; } }
      }
    }
    @font-face { font-family: ".st0"; src: url(font.st0.woff); }
  ]]></style>
  <rect id="rect1" class="st0 root" style="fill: url(#grad1);"/>
  <defs><linearGradient id="grad1"><stop offset="0%"/></linearGradient></defs>
</svg>
