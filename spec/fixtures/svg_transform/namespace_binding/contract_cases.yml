  "api": "rewrite(content, bind: {prefix => URI}, unbind: [prefix], remap: {URI => target_prefix})",
  "rules": {
    "source_resolution": "URI identity throughout selected serialized SVG, independently of lexical source prefix; nil/empty prefix means default.",
    "aliases": "Retain existing declarations unless explicitly unbound; repeated requests do not add duplicate declarations.",
    "redeclarations": "Preserve same-URI declarations and different-URI shadows; remap only matching URI names.",
    "collisions": "Reject target prefix declared anywhere to another URI, even if unused; ArgumentError /namespace conflict:/.",
    "default_attributes": "Reject default remap of URI used by any qualified attribute; ArgumentError /default namespace:/.",
    "default_elements": "Reject default binding/remap that would capture any unqualified element; ArgumentError /default namespace:/.",
    "unbind": "Remove all declarations of requested prefix only after remap; reject if any element or attribute still uses prefix; ArgumentError /namespace in use:/.",
    "validation": "String SVG root, well-formed XML with bound QName prefixes, map/array options, ASCII NCName prefixes excluding xml-prefixed reserved names, nonempty whitespace-free URI strings excluding the reserved XML and xmlns URIs; ArgumentError /invalid namespace request:/ or /invalid SVG:/.",
    "normalized_keys": "nil and empty-string prefixes identify the same default binding; conflicting normalized targets reject with ArgumentError /namespace conflict:/.",
    "parser_caveat": "Leptris strict parsing accepts unbound prefixed names, so the primitive explicitly rejects them before rewriting.",
    "scope": "One serialized SVG root only; all namespace declarations outside requested changes retained.",
    "repeat": "URI-qualified identity makes repeat remap and removed-unbind requests no-ops."
  },
