name: rake

on:
  push:
    branches: [ master, main ]
    tags: [ v* ]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main
    with:
      setup-tools: inkscape,ghostscript
      submodules: true
      choco-cache: true
      private-fonts: false
      cascade: false
    secrets:
      pat_token: ${{ secrets.CLARICLE_CI_PAT_TOKEN }}

  tests-passed:
    needs: rake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tests passed
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CLARICLE_CI_PAT_TOKEN || github.token }}
          repository: ${{ github.repository }}
          event-type: tests-passed
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "type": "tests-passed"}'

      - if: startsWith(github.ref, 'refs/tags/v')
        name: Repository ready for release
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CLARICLE_CI_PAT_TOKEN || github.token }}
          repository: ${{ github.repository }}
          event-type: do-release
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "type": "do-release"}'
