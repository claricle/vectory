[package]
name = "emf-to-eikogram"
version = "0.0.0"
edition = "2021"
publish = false
description = "The EMF-model → VIM transformer (claricle/vectory#102, claricle/emf#88): lifts the emf-core metafile model into the Vector Image Model with byte-parity against the Ruby renderer"

[dependencies]
# Pinned git dependency on claricle/emf@main (pre-publication cross-repo pin —
# emf-core stays in claricle/emf; this flips to the crates.io dep when the
# emf workspace publishes, per the pin note in the PR). Hosts without https
# access to github can rewrite to ssh per-invocation without config mutation:
#   GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0='url.ssh://git@github.com/claricle/emf.insteadOf #     https://github.com/claricle/emf' GIT_CONFIG_VALUE_0=yes \
#   CARGO_NET_GIT_FETCH_WITH_CLI=true cargo build
emf-core = { git = "https://github.com/claricle/emf", rev = "0a4f7ab6e6ba79407917cc3fdec226cb798fb748" }
eikogram = { path = "../eikogram" }
libz-sys = "1"
