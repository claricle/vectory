[package]
name = "eikogram-to-emf"
version = "0.0.0"
edition = "2021"
publish = false
description = "The VIM → EMF-model transformer (claricle/emf#90): lowers drawings onto the emf-core model, whose serializer writes the bytes, with byte-parity against the Ruby translation"

[dependencies]
# Pinned git dependency on claricle/emf@main (pre-publication cross-repo pin —
# the same pattern as the forward transformer crate; flips to the crates.io
# dep when the emf workspace publishes, per the pin note in the PR).
emf-core = { git = "https://github.com/claricle/emf", rev = "0a4f7ab6e6ba79407917cc3fdec226cb798fb748" }
eikogram = { path = "../eikogram" }
libz-sys = "1"
