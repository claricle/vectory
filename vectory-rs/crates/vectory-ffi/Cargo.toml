[package]
name = "vectory-ffi"
version = "0.0.0"
edition = "2021"
publish = false
description = "The C ABI over the vectory SVG model for the Ruby gem's native engine (vectory-rs lane 3)"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vectory = { path = "../vectory" }
