# The vectory-rs workspace — the Rust SVG model + vector-manipulation program
# (umbrella: claricle/vectory#96, lane 1: claricle/vectory#97).
#
# In-repo workspace (the emf-rs precedent): lives under vectory-rs/ inside the
# vectory repository and can be extracted to a standalone repo later if the
# owner opts for one. The published crate name is `vectory` (owner decision,
# 2026-11-25 — the etassia precedent: published crate takes the repo name).
# Nothing is published; publishing is an owner decision.
#
# Crates:
#   vectory      — the SVG model (decode + serialize, claricle/vectory#97)
#   eikogram — the Vector Image Model, the format-neutral drawing
#                  super-model (claricle/vectory#102)
#   vim-to-svg   — the VIM → SVG-model transformer (drawing → the SVG
#                  serialization tree, through the existing EmfsvgSvgBuilder
#                  serialize profile)
#   emf-to-eikogram — the EMF-model → VIM transformer (the conversion
#                  hub's EMF lane; emf-core is a pinned git dependency on
#                  claricle/emf@main until it publishes)
#   svg-to-eikogram — the SVG-model → VIM transformer (the reverse lane,
#                  claricle/emf#90: ingests the SVG model into the VIM with
#                  the Ruby translation's exact choices)
#   eikogram-to-emf — the VIM → EMF-model transformer (the reverse lane:
#                  lowers drawings onto the emf-core model, whose serializer
#                  writes the bytes)
#   emf88-parity  — the byte-parity acceptance harness (the emf#88 gate)
#   emf90-parity  — the round-trip acceptance harness (the emf#90 gate:
#                  EMF → VIM → SVG → VIM → EMF against the Ruby pipeline)
[workspace]
resolver = "2"
members = [
    "crates/vectory",
    "crates/eikogram",
    "crates/eikogram-to-svg",
    "crates/emf-to-eikogram",
    "crates/svg-to-eikogram",
    "crates/eikogram-to-emf",
    "crates/emf88-parity",
    "crates/emf90-parity",
    "crates/vectory-ffi",
]
