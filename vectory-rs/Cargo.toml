# The vectory-rs workspace — the Rust SVG model + vector-manipulation program
# (umbrella: claricle/vectory#96, lane 1: claricle/vectory#97).
#
# In-repo workspace (the emf-rs precedent): lives under vectory-rs/ inside the
# vectory repository and can be extracted to a standalone repo later if the
# owner opts for one. The published crate name is `vectory` (owner decision,
# 2026-11-25 — the etassia precedent: published crate takes the repo name).
# Nothing is published; publishing is an owner decision.
#
# Crates:
#   vectory      — the SVG model (decode + serialize, claricle/vectory#97)
#   vector-model — the Vector Image Model, the format-neutral drawing
#                  super-model (claricle/vectory#102)
#   vim-to-svg   — the VIM → SVG-model transformer (drawing → the SVG
#                  serialization tree, through the existing EmfsvgSvgBuilder
#                  serialize profile)
[workspace]
resolver = "2"
members = ["crates/vectory", "crates/vector-model", "crates/vim-to-svg"]
